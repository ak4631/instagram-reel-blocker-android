name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "$HOME/.android/reels-limiter"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/reels-limiter/release.jks"
          {
            echo "storeFile=$HOME/.android/reels-limiter/release.jks"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > "$HOME/.android/reels-limiter/keystore.properties"

      - name: Run tests
        run: ./gradlew test

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Collect release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/
          cp app/build/outputs/mapping/release/mapping.txt release/reels-limiter-mapping.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reels-limiter-release
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber
          else
            gh release create "$TAG_NAME" release/* \
              --title "Reels Limiter $TAG_NAME" \
              --generate-notes
          fi
